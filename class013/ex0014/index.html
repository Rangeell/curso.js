<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do dia</title>

    <script src="https://kit.fontawesome.com/766cec8ad2.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles/style.css">

</head>

<body>

    <header>
        <h1>Hora do dia</h1>
    </header>

    <section>
        <p id="horaAtual"></p>
        <p id="saudacao"></p>
        
        <div class="image" id="day">
            <img src="images/day.jpg" alt=" Imagem de um amanhecer">
        </div>
        
        <div class="image" id="afternoon">
            <img src="images/afternoon.jpg" alt="Imagem de um entardecer">
        </div>
        
        <div class="image" id="night">
            <img src="images/night.jpg" alt="Imagem de um anoitecer em uma cidade moderna">
        </div>
    </section>

    <footer>
         <p>&copy; Curso em vídeo</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
