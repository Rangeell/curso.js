<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>

    <style>
        body {
            font: normal 1.5rem Arial, Helvetica, sans-serif;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #area {
            display: flex;
            flex-flow: column-reverse wrap;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            color: white;
            background-color: rgba(0, 128, 0, 0.789);
            padding: 15px;
            border-radius: 9px;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.553);
            opacity: .8;
            transition: all .3s ease;
        }

        #area:hover {
            transform: scale(1.1) translate(-20px, -10px);
            cursor: pointer;
            opacity: 1;
            background-color: lightblue;
        }

        #area:active {
            transform: scale(.90) translate(20px, 10px);
            background-color: red;
            transition: .1s ease;
        }
    </style>

</head>

<body>
    <div id="area">
        <p>Interaja...</p>
        <p>Olá</p>
    </div>

    <script>
        var a = document.getElementById('area')
        a.addEventListener('click', clicou)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)

        function clicou() {
            a.innerText = 'Clicou'
            a.style.backgroundColor = 'red'
        }

        function entrar() {
            a.innerText = 'Entrou'
            a.style.backgroundColor = 'lightBlue'
        }

        function sair () {
            a.innerText = 'Saiu'
            a.style.backgroundColor = 'green'
        }
        
        var corpo = document.getElementsByTagName('body')[0]
        corpo.style.backgroundColor = 'orange'
    </script>
</body>

</html>
