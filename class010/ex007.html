<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>

    <style>
        body {
            font: normal 1rem Arial, Helvetica, sans-serif;
        }

        input {
            border-radius: 5px;
        }

        input[type='number'] {
            width: 100px;
        }

        div {
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <h1>Somando Valores</h1>
    <form action="" method="get">
        <label for="n1">Digite um número</label>
        <input type="number" name="num1" id="n1"> +
        
        <input type="number" name="num2" id="n2">
        <label for="n2">Digite outro número</label>

        <input type="button" value="Somar" onclick="somar()">

        <div id="res">Resultado</div>
    </form>
    
    <script>
        function somar () {
            var tn1 = document.getElementById('n1')
            var tn2 = document.querySelector('#n2')
            var res = document.getElementById('res')

            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value) 
            var s = n1 + n2

            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a ${s}`
        }
    </script>
</body>

</html>
