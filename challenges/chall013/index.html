<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 13 | Situação Aluno</title>

    <link rel="stylesheet" href="styles/style.css">

</head>

<body>

    <h1>Situação do aluno</h1>

    <div id="button">
        <p>Entrar com as notas</p>
    </div>
    <p>Clique no botão acima para informar as notas do aluno!</p>
    
    <table>
        <caption>Tabela de notas</caption>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Aluno</th>
                <th scope="col" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
                <th scope="col" rowspan="2">Situação</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Nome</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
                <td></td>
            </tr>
        </tbody>
    </table>
    
    <script src="js/script.js"></script>
</body>

</html>
