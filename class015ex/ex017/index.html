<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do dia</title>

    <script src="https://kit.fontawesome.com/766cec8ad2.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles/style.css">

</head>

<body>

    <header>
        <h1>Gerador de tabuada</h1>
    </header>

    <section>
        <form action="" method="get">
            <p>
                <label for="inumber">Número</label>
                <input type="number" name="number" id="inumber">
                <input type="button" value="Gerar tabuada">
            </p>
            <p>
                <textarea name="tabuada" id="itabuada" placeholder="Digite um número acima" readonly></textarea>
            </p>
        </form>
    </section>

    <footer>
         <p>&copy; Curso em vídeo</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
