<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <script src="https://kit.fontawesome.com/766cec8ad2.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles/style.css">

</head>

<body>

    <header>
        <h1>Vamos contar</h1>
    </header>

    <section>
        <form action="" method="get">
            <p>
                <label for="iinicio">Início</label>
                <input type="number" name="Inicio" id="iinicio" required>
            </p>
            
            <p>
                <label for="ifim">Fim:</label>
                <input type="number" name="Fim" id="ifim" required>
            </p>

            <p>
                <label for="ipasso">Passo:</label>
                <input type="number" name="Passo" id="ipasso" required>
            </p>

            <input type="button" value="Contar">
        </form>

        <p id="contando"></p>
        <p id="contar"></p>
    </section>

    <footer>
         <p>&copy; Curso em vídeo</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
